name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libsqlite3-dev \
            libsdl2-dev \
            libsdl2-ttf-dev \
            xvfb

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Build
        run: zig build

      - name: Run unit tests
        run: zig build test

      - name: Verify binary runs
        run: |
          ./zig-out/bin/sqlitequery --version
          ./zig-out/bin/sqlitequery --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlitequery-linux-x86_64
          path: zig-out/bin/sqlitequery
