name: Release

on:
  workflow_dispatch:

env:
  VERSION: "0.1.${{ github.run_number }}"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update snapcraft.yaml version
        run: |
          sed -i "s/^version: .*/version: ${{ env.VERSION }}/" snapcraft.yaml

      - name: Commit, tag, and push
        run: |
          git config --global user.name "Continuous Integration"
          git config --global user.email "username@users.noreply.github.com"
          git add snapcraft.yaml
          git commit -m "Bump up snapcraft version to v${{ env.VERSION }}"
          git push origin HEAD:main

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
            artifact: sqlitequery-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-dev cmake libglfw3-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev
          curl -sL https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_linux_amd64.tar.gz -o /tmp/raylib.tar.gz
          tar xzf /tmp/raylib.tar.gz -C /tmp
          sudo cp /tmp/raylib-5.5_linux_amd64/lib/libraylib.a /usr/local/lib/
          sudo cp /tmp/raylib-5.5_linux_amd64/lib/libraylib.so* /usr/local/lib/
          sudo cp /tmp/raylib-5.5_linux_amd64/include/*.h /usr/local/include/
          curl -sL https://raw.githubusercontent.com/raysan5/raygui/master/src/raygui.h -o /tmp/raygui.h
          sudo cp /tmp/raygui.h /usr/local/include/
          sudo ldconfig

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Package
        run: tar czf ${{ matrix.artifact }}.tar.gz -C zig-out/bin sqlitequery

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            *.tar.gz
